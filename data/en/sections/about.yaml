# a summary about you
summary: 'I train and mentor the people who design tomorrow''s software. As an instructor for software architects and developers, I deliver an award-winning architecture and clean-code curriculum that helps engineers grow into confident technical leaders. This builds on 25+ years of hands-on experience in software design and development — across many domains, team sizes and continents — currently at a global company that is a leader in its domain. Alongside training, I architect SaaS and cloud-native solutions on **Azure** and **AWS**: scalable, resilient microservices grounded in clean architecture and modern CI/CD. I have led architecture for teams of 250+ developers and guided global architecture groups of 30+ architects. I am based in the New York City metropolitan area and work in English, German and Turkish.'

