variables:
- group: AwsSecretsForS3kaanbardak

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  # Check out the repo (submodules: true keeps the still-present Ananke theme happy)
  - checkout: self
    submodules: true
    fetchDepth: 0

  # Toha is installed via Hugo Modules, which requires Go
  - task: GoTool@0
    displayName: Install Go
    inputs:
      version: '1.25'

  # Toha's asset pipeline (fonts, icons, KaTeX, Bootstrap) needs Node/npm
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '20.x'

  # Install Hugo (extended is required by Toha for SCSS)
  - task: Bash@3
    displayName: Install Hugo
    inputs:
      targetType: inline
      script: |
        HUGO_VERSION=0.156.0
        wget https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
        tar -xzf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
        sudo mv hugo /usr/local/bin/hugo
        hugo version

  # Install npm dependencies (uses package-lock.json for reproducible builds)
  - task: Bash@3
    displayName: Install npm dependencies
    inputs:
      targetType: inline
      script: |
        npm ci

  # Build the Hugo site (downloads the Toha module automatically via Go)
  - task: Bash@3
    displayName: Build Hugo Site
    inputs:
      targetType: inline
      script: |
        hugo --minify --gc

  # Install AWS CLI
  - task: Bash@3
    displayName: Install AWS CLI
    inputs:
      targetType: inline
      script: |
        sudo apt-get update
        sudo apt-get install -y awscli
        aws --version

  # Configure AWS credentials
  - task: Bash@3
    displayName: Configure AWS Credentials
    inputs:
      targetType: inline
      script: |
        aws configure set aws_access_key_id $(AWS_ACCESS_KEY_ID)
        aws configure set aws_secret_access_key $(AWS_SECRET_ACCESS_KEY)
        aws configure set default.region $(AWS_REGION)

  # Sync to S3
  - task: Bash@3
    displayName: Upload to S3
    inputs:
      targetType: inline
      script: |
        aws s3 sync public/ s3://$(S3_BUCKET_NAME) --delete
